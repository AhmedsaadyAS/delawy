# Delawy web worker — Cloudflare Workers + D1 (local-first, experimental).
#
# No account IDs or secrets live in this file. The database_id below is a
# PLACEHOLDER for local development only (`--local` never contacts the API).
# Do NOT deploy and do NOT apply migrations to a remote database without the
# user's explicit approval — when that day comes, create the real database
# with `wrangler d1 create delawy` and put its id here.

name = "delawy-web"
main = "src/index.js"
compatibility_date = "2026-11-18"

[[d1_databases]]
binding = "DB"
database_name = "delawy"
database_id = "00000000-0000-0000-0000-000000000000"
migrations_dir = "migrations"
